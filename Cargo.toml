[workspace]
members = [
  "crates/nep-core",
  "crates/nep-world",
  "crates/nep-protocol-java",
  "crates/nep-protocol-bedrock",
  "crates/nep-net",
  "crates/nep-plugin-api",
  "crates/nep-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Neptunium Contributors"]

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
flate2 = "1"
base64 = "0.22"
